version: '3'

services:
  core:
    restart: always
    image: 'ghcr.io/event-cell/core:main'
    ports:
      - '80:80'
    volumes:
      - type: bind
        source: "${CORE_DATA}"
        target: /data
      # Writable: the timing software owns the .scdb files, but the server
      # writes radar speeds to Speeds.db in this directory
      - type: bind
        source: "${TIMING_DB}"
        target: /app/prisma/Events
